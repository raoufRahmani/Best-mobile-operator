# pyproject.toml : les librairies du projet, gérées par uv (https://docs.astral.sh/uv/)
# Installer : uv sync     Lancer les tests : uv run pytest
# Les versions exactes de tout (librairies et leurs dépendances) sont figées dans uv.lock.
[project]
name = "best-mobile-operator"
version = "1.0.0"
description = "Quel opérateur chez moi ? Compare Orange, SFR, Bouygues et Free à ton adresse"
requires-python = ">=3.12,<3.15"
dependencies = [
    "pandas==3.0.6",
    "numpy==2.5.4",
    "requests==2.34.2",
    "flask==3.1.3",
    "geopandas==1.2.0",
    "shapely==2.2.0",
    "pyproj==3.8.0",
    "rasterio==1.5.1",   # pas 1.5.2 : pas de version précompilée pour macOS 14 (Mac à puce Apple)
    "py7zr==1.1.4",
    "waitress==3.0.2",
]

# Pour les tests seulement (installé par « uv sync », pas dans l'image Docker)
[dependency-groups]
dev = ["pytest==9.2.0"]
